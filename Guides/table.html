<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="4">
        <tr>
            <th>Day</th>
            <th>Subject</th>
            <th>Time</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>Math</td>
            <td>10:00 AM</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>Science</td>
            <td>11:00 AM</td>
        </tr>
    </table>
    
</body>
</html>
