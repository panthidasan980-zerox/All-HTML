<!DOCTYPE html>
<html>
<head>
  <title>Task 8</title>
  <link rel="stylesheet" href="task8.css">
</head>
<body>
  <div class="page">

    <h3 class="title">STUDENT REPORT CARD</h3>

    <div class="report">
      <div class="student">
        <div class="avatar">🧒</div>
        <div>
          <p class="name">Alex</p>
          <p>Grade: 4</p>
          <p>Student ID: 104</p>
        </div>
      </div>

      <h4>Subject Marks</h4>
      <p>Math: 90</p>
      <p>English: 85</p>
      <p>Science: 95</p>
    </div>

    <div class="form">
      <h4>Student Registration Form</h4>

      <label>Full Name</label>
      <input type="text" placeholder="Enter your name">

      <label>Grade</label>
      <input type="text" placeholder="Enter your grade">

      <label>Favorite Subject</label>
      <select>
        <option>Choose a subject</option>
        <option>Math</option>
        <option>English</option>
        <option>Science</option>
      </select>

      <button>Register</button>
    </div>

  </div>
</body>
</html>
